version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: nestjs-db-prod
    env_file:
      - ./.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-api-prod
    # restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    #   DB_USERNAME: ${DB_USERNAME}
    #   DB_PASSWORD: ${DB_PASSWORD}
    #   DB_DATABASE: ${DB_DATABASE}
    depends_on:
      db:
        condition: service_healthy # DB가 healthy 상태일 때 실행

volumes:
  postgres_prod_data: