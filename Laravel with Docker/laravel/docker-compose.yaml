version: "3.8"

services: 
  server:
    # image: 'nginx:stable-alpine'
    build: 
      context: .
      dockerfile: dockerfiles/nginx.dockerfile
    ports: 
      - '8000:80'
    # volumes: 
    #   - ./src:/var/www/html
    #   - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro # read only -> ro
    depends_on:
      - php
      - mysql
  php:
    build: 
      context: .
      dockerfile: dockerfiles/php.dockerfile
    # volumes:
    #   - ./src:/var/www/html:delegated
    ports:
      - '3000:9000'
  mysql:
    image: mysql:5.7
    env_file:
      - ./env/mysql.env

  # docker-compose run --rm composer create-project --prefer-dist laravel/laravel .
  composer:  # 주로 초기 설정용? npm create같이 
    build:
      context: ./dockerfiles
      dockerfile: composer.dockerfile
    volumes:
      - ./src:/var/www/html
  artisan:
    build:
      context: .
      dockerfile: dockerfile/php.dockerfile
    volumes:
      - ./src:/var/www/html
    # 도커파일에 없는경우 추가
    entrypoint: ["php", "/var/www/html/artisan"]
  npm:
    image: node:22
    working_dir: /var/www/html
    entrypoint: ["npm"]
    volumes:
      - ./src:/var/www/html


